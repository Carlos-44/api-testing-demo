name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules
        id: node-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (cache miss)
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm ci

      # API tests use APIRequestContext, so no browser install is needed
      - name: Run tests
        run: npx playwright test
        continue-on-error: true # the report stage decides pass or fail

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  report:
    name: Publish Results
    runs-on: ubuntu-latest
    needs: test
    if: always()
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results

      - name: Publish test results
        uses: dorny/test-reporter@v1
        with:
          name: API Tests
          path: test-results/results.xml
          reporter: java-junit
          fail-on-error: true

  notify:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [test, report]
    if: always()
    steps:
      - name: Summary
        env:
          TEST_RESULT: ${{ needs.test.result }}
          REPORT_RESULT: ${{ needs.report.result }}
        run: |
          echo "## Pipeline Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "Test stage: $TEST_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "Report stage: $REPORT_RESULT" >> "$GITHUB_STEP_SUMMARY"
